baseURL: https://kermit4495.github.io/ClubWebsite/
locale: en-us
title: "Data Science Club (BIF)"
theme: ["PaperMod"]

params:
  defaultTheme: dark
  disableThemeToggle: true
  ShowToc: false
  assets:
    favicon: bonsai.jpeg #the small icon shown in the browser tab
  socialIcons:
    - name: github
      url: "https://github.com/kermit4495/ClubWebsite"
  math: True
  profileMode:
    enabled: true
    title: "Data Science Club (BIF)"
    subtitle: "<Description>"
    imageUrl: "/ClubWebsite/bonsai.jpeg"
    imageWidth: 300
    imageHeight: 300

menu:
  main:
    - identifier: Class
      name: Class
      url: /class/
      weight: 10
    - identifier: Project
      name: Project
      url: /project/
      weight: 20
    - identifier: Submissions
      name: Student Submissions
      url: /submissions/
      weight: 30

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
          - - $$
            - $$
        enable: true
